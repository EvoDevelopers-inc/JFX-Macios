plugins {
    id 'java'
    id 'maven-publish'
}

group = findProperty('publishedGroup') ?: 'evo.developers.ru'
version = findProperty('publishedVersion') ?: '1.3-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11

    withSourcesJar()
    withJavadocJar()
}

def javafxOs = System.getProperty('os.name').toLowerCase()
def javafxArch = System.getProperty('os.arch').toLowerCase()
def javafxClassifier = javafxOs.contains('win') ? 'win'
        : javafxOs.contains('mac') ? (javafxArch.contains('aarch64') || javafxArch.contains('arm') ? 'mac-aarch64' : 'mac')
        : 'linux'

dependencies {
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    compileOnly("org.openjfx:javafx-base:21.0.6:${javafxClassifier}")
    compileOnly("org.openjfx:javafx-graphics:21.0.6:${javafxClassifier}")
    compileOnly("org.openjfx:javafx-controls:21.0.6:${javafxClassifier}")

    implementation("net.java.dev.jna:jna-platform:5.18.1")
    implementation("net.java.dev.jna:jna:5.18.1")

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group
            artifactId = findProperty('publishedArtifact') ?: 'jfx-macios'
            version = project.version
        }
    }

    repositories {
        mavenLocal()
    }
}